# Kentico.Xperience.* and @kentico/* are updated with the update-xperience agent skill,
# which also regenerates examples/DancingGoat for the new version.
#
# cooldown (supply-chain hardening): a version is proposed only once it is this many days old, so a
# compromised or broken release is usually caught and pulled first. Security updates ignore it. The npm
# folders' .npmrc files set min-release-age to the same 3 days for local installs.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      - dependency-name: "Kentico.Xperience.*"
    groups:
      # Bumps together; keep sdk.version in aspire.config.json in step
      aspire:
        patterns: ["Aspire.*", "CommunityToolkit.Aspire.*"]
      # Everything else in one pull request, majors included
      nuget:
        patterns: ["*"]

  # One entry for both npm folders: a group spans them, so each update is one pull request a week
  - package-ecosystem: npm
    directories:
      # template:admin:start
      - /src/Kentico.Xperience.RepoTemplate.Admin/Client
      # template:admin:end
      - /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # template:admin:start
      - dependency-name: "@kentico/*"
      # Must match the React version the Xperience admin ships
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Held back until @kentico/xperience-webpack-config supports them
      - dependency-name: "@babel/*"
        versions: [">=8"]
      # template:admin:end
      # Held back for now (major rewrite; the admin client also needs @kentico/xperience-webpack-config support)
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # Majors too: fewer pull requests means fewer CI runs (see the merge queue note in docs/Contributing-Setup.md)
      npm:
        patterns: ["*"]

  # global.json pins the SDK exactly (see AGENTS.md). CI fails on this PR until the lock files are
  # regenerated with the new SDK: dotnet restore --force-evaluate
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # semver-major-days is not supported for GitHub Actions
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
