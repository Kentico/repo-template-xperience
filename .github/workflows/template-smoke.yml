# Template repository only: setup-repo (Rename-Template.ps1) deletes this file.
# Renames the template for each family, with and without the admin project, then restores,
# builds, tests, and checks formatting of the result.
name: "Template Smoke"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  template_smoke:
    name: Template Smoke (${{ matrix.family }}${{ matrix.example && ' example' || '' }}${{ matrix.noAdmin && ' no admin' || '' }})
    if: github.repository == 'Kentico/repo-template-xperience'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: Kentico
            name: SmokeTest
          - family: Labs
            name: SmokeTest
          - family: Community
            name: SmokeTest
            org: smoke-org
            author: Smoke Author
          - family: Labs
            name: SmokeTest
            example: true
          - family: Kentico
            name: SmokeTest
            noAdmin: true
          - family: Community
            name: SmokeTest
            org: smoke-org
            author: Smoke Author
            noAdmin: true
          - family: Community
            name: SmokeTest
            org: smoke-org
            author: Smoke Author
            example: true
            noAdmin: true

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        if: ${{ !matrix.noAdmin }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Kentico.Xperience.RepoTemplate.Admin/Client/package-lock.json

      - name: Rename template
        run: |
          $params = @{ Family = '${{ matrix.family }}'; Name = '${{ matrix.name }}' }
          if ('${{ matrix.org }}') { $params.GitHubOrg = '${{ matrix.org }}' }
          if ('${{ matrix.author }}') { $params.Author = '${{ matrix.author }}' }
          if ('${{ matrix.example }}' -eq 'true') { $params.Example = $true }
          if ('${{ matrix.noAdmin }}' -eq 'true') { $params.NoAdmin = $true }
          ./.claude/skills/setup-repo/scripts/Rename-Template.ps1 @params

      # Removing the admin project changes DancingGoat's lock file
      - name: Restore
        run: dotnet restore ${{ matrix.noAdmin && '--force-evaluate' || '--locked-mode' }}

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Pack
        if: ${{ !matrix.example }}
        run: dotnet pack src/*.Libs.slnx --configuration Release --no-build --output nupkg

      # Workflow and pipeline files left behind must still parse
      - name: Check YAML
        run: |
          Get-ChildItem .github, .azuredevops -Recurse -Include *.yml -ErrorAction SilentlyContinue | ForEach-Object {
            yq eval '.' $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Invalid YAML: $($_.FullName)" }
          }
